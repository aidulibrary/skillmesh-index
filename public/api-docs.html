<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP 协议 API 文档 — Swagger UI</title>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
    <script>
      // P1-1 首屏主题前置：与站点其它入口保持同一主题源
      (function () {
        try {
          var t = localStorage.getItem("ccp-theme");
          var d =
            t === "dark" ||
            (!t &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            d ? "dark" : "light",
          );
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/css/tokens.css?v=20260913c" />
    <link rel="stylesheet" href="/css/style.css?v=20260913c" />
    <link rel="stylesheet" href="/dark-mode.css?v=20260913c" />
    <link rel="stylesheet" href="/swagger/swagger-ui.css" />
    <style>
      html {
        box-sizing: border-box;
        overflow-y: scroll;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--sm-bg-canvas);
      }
      .topbar {
        display: none;
      }
      .swagger-ui .info .title {
        font-size: 28px;
      }
      .swagger-ui .info {
        margin: 20px 0;
      }
      .swagger-ui .scheme-container {
        box-shadow: none;
      }
      /* 主题切换按钮：与其他入口保持同一交互与外观 */
      .theme-toggle {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid var(--sm-border-subtle);
        background: var(--sm-bg-surface);
        color: var(--sm-fg-primary);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        box-shadow: var(--sm-shadow-md);
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- S12-A：共享导航栏（与 index.html 同步维护，版本模板 v20260913c） -->
    <nav>
      <div class="nav-inner">
        <a href="/" class="brand">
          <div class="logo-icon">◆</div>
          <span data-i18n="brandName">插台 SkillMesh</span>
        </a>
        <div class="nav-links">
          <a href="/" data-i18n="navHome">首页</a>
          <a href="/#quickstart" data-i18n="navQuickstart">快速开始</a>
          <a href="/#explore" data-i18n="navExplore">能力探索</a>
          <a href="/api-docs.html" class="nav-current" data-i18n="navApiDocs"
            >API 文档</a
          >
          <a href="/health.html" data-i18n="navHealth">健康面板</a>
          <a href="/#about" data-i18n="navAbout">关于</a>
        </div>
        <div class="nav-right">
          <div class="lang-dropdown" id="lang-dropdown">
            <button
              class="lang-trigger"
              onclick="App.toggleLangMenu()"
              aria-label="切换语言"
              aria-expanded="false"
            >
              <svg
                class="globe-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10" />
                <path d="M2 12h20" />
              </svg>
              <span id="lang-current-label">ZH</span>
              <span class="chevron">▾</span>
            </button>
            <div class="lang-menu" id="lang-menu">
              <button
                class="lang-option active"
                data-lang="zh"
                onclick="App.setLang('zh')"
              >
                <span class="lang-flag">🇨🇳</span> 中文
                <span class="lang-check">✓</span>
              </button>
              <button
                class="lang-option"
                data-lang="en"
                onclick="App.setLang('en')"
              >
                <span class="lang-flag">🇺🇸</span> English
                <span class="lang-check">✓</span>
              </button>
              <button
                class="lang-option"
                data-lang="ja"
                onclick="App.setLang('ja')"
              >
                <span class="lang-flag">🇯🇵</span> 日本語
                <span class="lang-check">✓</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <div id="swagger-ui"></div>
    <noscript>需要启用 JavaScript 才能查看 API 文档。</noscript>
    <button
      class="theme-toggle"
      onclick="toggleTheme()"
      title="切换主题"
      aria-label="切换主题"
    >
      🌓
    </button>
    <script src="/js/i18n.js?v=20260913c"></script>
    <script src="/js/app.js?v=20260913c"></script>
    <script src="/dark-mode.js?v=20260913c"></script>
    <script src="/swagger/swagger-ui-bundle.js"></script>
    <script src="/swagger/swagger-ui-standalone-preset.js"></script>
    <script>
      // D1：Swagger UI 资源已本地化（public/swagger/），不再依赖 jsdelivr CDN
      if (typeof SwaggerUIBundle === "undefined") {
        var el = document.getElementById("swagger-ui");
        if (el) {
          el.innerHTML =
            '<div style="max-width:680px;margin:80px auto;padding:24px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;font-family:system-ui,sans-serif;line-height:1.7">' +
            '<h2 style="margin:0 0 12px">Swagger UI 资源加载失败</h2>' +
            "<p>本地脚本 <code>/swagger/swagger-ui-bundle.js</code> 未能加载。请确认该文件已随站点部署，或直接查看原始规范：</p>" +
            '<ul><li><a href="/openapi.json">/openapi.json</a>（OpenAPI 3.0.3 原始文档）</li>' +
            '<li><a href="/docs/quickstart.md">/docs/quickstart.md</a>（快速开始）</li></ul>' +
            "</div>";
        }
      } else {
        var standalonePreset =
          typeof SwaggerUIStandalonePreset !== "undefined"
            ? SwaggerUIStandalonePreset
            : SwaggerUIBundle.SwaggerUIStandalonePreset;
        SwaggerUIBundle({
          url: "/openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: standalonePreset
            ? [SwaggerUIBundle.presets.apis, standalonePreset]
            : [SwaggerUIBundle.presets.apis],
          layout: "BaseLayout",
          defaultModelsExpandDepth: -1,
          defaultModelExpandDepth: 1,
          docExpansion: "list",
          filter: true,
          showExtensions: true,
          showCommonExtensions: true,
          tryItOutEnabled: true,
        });
      }
    </script>
  </body>
</html>
