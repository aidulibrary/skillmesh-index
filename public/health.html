<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCP 联邦网络健康面板</title>
    <link rel="icon" type="image/svg+xml" href="/assets/brand/favicon.svg" />
    <script>
      // P1-1 首屏主题前置：消除暗色用户的白屏闪烁
      (function () {
        try {
          var t = localStorage.getItem("ccp-theme");
          var d =
            t === "dark" ||
            (!t &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            d ? "dark" : "light",
          );
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/css/tokens.css?v=20260913b" />
    <link rel="stylesheet" href="/css/style.css?v=20260913b" />
    <link rel="stylesheet" href="/health.css?v=20260913b" />
    <link rel="stylesheet" href="/dark-mode.css?v=20260913b" />
  </head>
  <body>
    <!-- S12-A：共享导航栏（与 index.html 同步维护，版本模板 v20260913b） -->
    <nav>
      <div class="nav-inner">
        <a href="/" class="brand">
          <div class="logo-icon">◆</div>
          <span data-i18n="brandName">插台 SkillMesh</span>
        </a>
        <div class="nav-links">
          <a href="/" data-i18n="navHome">首页</a>
          <a href="/#quickstart" data-i18n="navQuickstart">快速开始</a>
          <a href="/#explore" data-i18n="navExplore">能力探索</a>
          <a href="/api-docs.html" data-i18n="navApiDocs">API 文档</a>
          <a href="/health.html" class="nav-current" data-i18n="navHealth"
            >健康面板</a
          >
          <a href="/#about" data-i18n="navAbout">关于</a>
        </div>
        <div class="nav-right">
          <div class="lang-dropdown" id="lang-dropdown">
            <button
              class="lang-trigger"
              onclick="App.toggleLangMenu()"
              aria-label="切换语言"
              aria-expanded="false"
            >
              <svg
                class="globe-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="2" y1="12" x2="22" y2="12" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10" />
                <path d="M2 12h20" />
              </svg>
              <span id="lang-current-label">ZH</span>
              <span class="chevron">▾</span>
            </button>
            <div class="lang-menu" id="lang-menu">
              <button
                class="lang-option active"
                data-lang="zh"
                onclick="App.setLang('zh')"
              >
                <span class="lang-flag">🇨🇳</span> 中文
                <span class="lang-check">✓</span>
              </button>
              <button
                class="lang-option"
                data-lang="en"
                onclick="App.setLang('en')"
              >
                <span class="lang-flag">🇺🇸</span> English
                <span class="lang-check">✓</span>
              </button>
              <button
                class="lang-option"
                data-lang="ja"
                onclick="App.setLang('ja')"
              >
                <span class="lang-flag">🇯🇵</span> 日本語
                <span class="lang-check">✓</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <header class="header">
      <h1>CCP 联邦网络健康面板</h1>
      <p class="subtitle">SkillMesh — 能力通约协议 联邦网络可观测性仪表盘</p>
      <div id="status-overview" class="status-overview">
        <span class="status-indicator" id="overall-status">加载中...</span>
        <span class="timestamp" id="timestamp"></span>
      </div>
    </header>

    <main class="dashboard">
      <section class="card stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-capabilities">--</div>
          <div class="stat-label">能力锚点</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-nodes">--</div>
          <div class="stat-label">联邦节点</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-contributors">--</div>
          <div class="stat-label">贡献者</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-telemetries">--</div>
          <div class="stat-label">遥测记录</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-proposals">--</div>
          <div class="stat-label">治理提案</div>
        </div>
      </section>

      <section class="card">
        <h2>节点状态</h2>
        <div class="node-summary" id="node-summary">
          <span class="node-badge healthy"
            >🟢 健康: <span id="healthy-count">0</span></span
          >
          <span class="node-badge degraded"
            >🟡 降级: <span id="degraded-count">0</span></span
          >
          <span class="node-badge offline"
            >🔴 离线: <span id="offline-count">0</span></span
          >
        </div>
        <div class="table-container">
          <table id="nodes-table">
            <thead>
              <tr>
                <th>节点</th>
                <th>端点</th>
                <th>状态</th>
                <th>信任分数</th>
                <th>能力数量</th>
                <th>最后交换</th>
              </tr>
            </thead>
            <tbody id="nodes-tbody">
              <tr>
                <td colspan="6" class="loading">加载中...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>索引覆盖率</h2>
        <div class="coverage-bar" id="coverage-bar">
          <div class="coverage-fill" id="coverage-fill" style="width: 0%"></div>
          <span class="coverage-text" id="coverage-text">0%</span>
        </div>
        <div class="coverage-detail" id="coverage-detail"></div>
      </section>

      <section class="card">
        <h2>24 小时遥测</h2>
        <div class="telemetry-stats" id="telemetry-stats">
          <div class="telemetry-card">
            <div class="telemetry-value" id="telemetry-total">--</div>
            <div class="telemetry-label">总计</div>
          </div>
          <div class="telemetry-card">
            <div class="telemetry-value" id="telemetry-24h">--</div>
            <div class="telemetry-label">最近24小时</div>
          </div>
        </div>
        <div id="telemetry-types" class="telemetry-types"></div>
      </section>

      <section class="card">
        <h2>能力分类分布</h2>
        <div id="categories-chart" class="categories-chart"></div>
      </section>
    </main>

    <footer class="footer">
      <p>CCP v1.0.0 · SkillMesh 联邦网络 · 数据每 60 秒自动刷新</p>
    </footer>

    <script src="/js/i18n.js?v=20260913b"></script>
    <script src="/js/app.js?v=20260913b"></script>
    <script src="/health.js?v=20260913b"></script>
    <script src="/dark-mode.js?v=20260913b"></script>
    <button
      class="theme-toggle"
      onclick="toggleTheme()"
      aria-label="切换主题"
      style="
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        z-index: 9999;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        cursor: pointer;
        font-size: 1.2rem;
      "
      title="切换主题"
    >
      🌓
    </button>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
  </body>
</html>
