name: Collect Capabilities

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  collect:
    name: Trigger Collection
    runs-on: ubuntu-latest
    steps:
      - name: Trigger admin/collect
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "X-Admin-Key: ${{ secrets.COLLECT_ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            "https://skillmesh.pages.dev/api/ccp/v1/admin/collect")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "$BODY" | jq .
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Collection failed with status $HTTP_CODE"
            exit 1
          fi
