<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="sm-mark-title">
  <title id="sm-mark-title">SkillMesh / 插台</title>

  <!-- 台：承载基座（Mesh 边界） -->
  <rect x="2" y="2" width="28" height="28" rx="7.5" fill="none" stroke="#18181B" stroke-width="2"/>

  <!-- Mesh：网格上的其他能力锚点 -->
  <g fill="#18181B">
    <circle cx="8"  cy="8"  r="1.4"/>
    <circle cx="16" cy="8"  r="1.4"/>
    <circle cx="24" cy="8"  r="1.4"/>
    <circle cx="8"  cy="16" r="1.4"/>
    <circle cx="24" cy="16" r="1.4"/>
    <circle cx="8"  cy="24" r="1.4"/>
    <circle cx="16" cy="24" r="1.4"/>
    <circle cx="24" cy="24" r="1.4"/>
  </g>

  <!-- 台：插孔（协议承口 / 发现半径） -->
  <circle cx="16" cy="16" r="5.6" fill="none" stroke="#0D9488" stroke-width="1.1"/>

  <!-- 插：锚点（被激活的能力单元） -->
  <circle cx="16" cy="16" r="3.6" fill="#0D9488"/>
</svg>
