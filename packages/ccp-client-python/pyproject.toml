[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccp-client"
version = "1.0.0"
description = "CCP 协议 Python 客户端 — 能力通约协议的 Python 参考实现"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CCP Community", email = "ccp@skillmesh.礼字号.中国" }
]
keywords = ["ccp", "skillmesh", "capability", "discovery", "trust-vector", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "urllib3>=2.0",
]

[project.urls]
Homepage = "https://skillmesh.礼字号.中国"
Repository = "https://github.com/aidulibrary/skillmesh-index"
"CCP Spec" = "https://github.com/aidulibrary/skillmesh-index/tree/main/ccp-spec"

[tool.setuptools.packages.find]
where = ["src"]